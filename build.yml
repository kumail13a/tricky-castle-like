name: Build APK from zip
on: [push, workflow_dispatch]
permissions: { contents: read, pages: write, id-token: write }
defaults:
  run:
    working-directory: tricky-castle-like
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q tricky-castle-like.zip
        working-directory: .
      - run: |
          sed -i "s#https://USERNAME.github.io/tricky-castle-like/#https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#" www/config.js
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r icons/* android/app/src/main/res/
          sed -i 's/<activity /<activity android:screenOrientation="landscape" /' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: racepord-castel-apk
          path: tricky-castle-like/android/app/build/outputs/apk/debug/app-debug.apk
  updates:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q tricky-castle-like.zip
        working-directory: .
      - run: |
          sed -i "s#https://USERNAME.github.io/tricky-castle-like/#https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#" www/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: tricky-castle-like/www }
      - id: d
        uses: actions/deploy-pages@v4
